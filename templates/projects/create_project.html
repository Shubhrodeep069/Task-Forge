{% extends 'base.html' %}

{% block title %}Create Project - Task Forge{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Project 🚀</h1>

        <p class="auth-subtitle">
            Start a new project and organize your team's work.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Create Project
            </button>
        </form>

        <p class="auth-footer">
            <a href="{% url 'dashboard' %}">
                ← Back to Dashboard
            </a>
        </p>

    </div>

</div>

{% endblock %}
