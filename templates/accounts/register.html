{% extends 'base.html' %}

{% block title %}Create Account - Task Forge{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join Task Forge and start managing your projects.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Create Account
            </button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="#">Login</a>
        </p>

    </div>

</div>

{% endblock %}
