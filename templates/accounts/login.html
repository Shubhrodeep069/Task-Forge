{% extends 'base.html' %}

{% block title %}Login - Task Forge{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back 👋</h1>

        <p class="auth-subtitle">
            Login to continue managing your projects.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Login
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{% url 'register' %}">Create Account</a>
        </p>

    </div>

</div>

{% endblock %}
